# .github/workflows/pr-title.yml
name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Valid types (customize as needed)
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
          requireScope: false  # Set to true if you want scopes required
          subjectPattern: ^[A-Z].+$  # Enforce capital first letter
          subjectPatternError: |
            The subject must start with a capital letter.